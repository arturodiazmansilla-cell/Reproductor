<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reproductor de video y música</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4b3fe0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#14202b;--mute:#5d6b7a;--line:#d6dce4;--acc:#4b3fe0;--acc-ink:#fff;--stage:#0c1117;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1218;--panel:#161d26;--ink:#e8edf3;--mute:#93a1b1;--line:#263140;--acc:#8f86ff;--acc-ink:#0d1218;--stage:#06090d;--err:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1218;--panel:#161d26;--ink:#e8edf3;--mute:#93a1b1;--line:#263140;--acc:#8f86ff;--acc-ink:#0d1218;--stage:#06090d;--err:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.app{max-width:1180px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"top top" "main side"}
header{grid-area:top;display:flex;align-items:center;gap:10px}
h1{font-size:1.35rem;font-weight:800;margin:0;margin-right:auto;letter-spacing:-.01em}
.btn{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.main{grid-area:main;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.stage{position:relative;aspect-ratio:16/9;background:var(--stage);display:grid;place-items:center}
.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--stage)}
.stage.audio video{visibility:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:none}
.stage.audio canvas{display:block}
.title{position:absolute;left:16px;right:16px;bottom:12px;color:#fff;font-weight:600;text-shadow:0 1px 8px #000;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{position:absolute;inset:0;display:grid;place-content:center;gap:12px;text-align:center;color:#c4cdd8;padding:24px}
.empty strong{font-size:1.3rem;color:#fff}
.stage.has .empty{display:none}
.drag .stage{outline:3px dashed var(--acc);outline-offset:-10px}
.ctrl{padding:14px 16px 16px;display:grid;gap:10px}
.seek{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-variant-numeric:tabular-nums;color:var(--mute);font-size:.85rem}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--acc) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--acc) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--acc);margin-top:-5px;border:0}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--acc);border:0}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);position:relative}
.ib:hover{background:var(--bg)}
.ib svg{width:22px;height:22px}
.ib.on{color:var(--acc)}
.ib.big{width:54px;height:54px;background:var(--acc);color:var(--acc-ink)}
.ib.big:hover{background:var(--acc);filter:brightness(1.1)}
.ib.big svg{width:26px;height:26px}
#rep[data-m="2"]::after{content:"1";position:absolute;font-size:.6rem;font-weight:800;right:8px;bottom:6px}
.vol{display:flex;align-items:center;gap:4px;width:150px}
.spd{min-width:52px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-weight:600;font-size:.85rem}
aside{grid-area:side;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0;max-height:640px}
aside .top{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
aside h2{margin:0;font-size:1rem;font-weight:800}
#q{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
ul{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px}
li:hover{background:var(--bg)}
li.act{background:var(--bg);box-shadow:inset 3px 0 var(--acc)}
li .pl{flex:1;min-width:0;text-align:left;display:grid;gap:2px}
li .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
li.act .n{color:var(--acc)}
li .m{font-size:.78rem;color:var(--mute)}
li .rm{color:var(--mute);width:30px;height:30px;border-radius:50%;font-size:1.1rem}
li .rm:hover{background:var(--line)}
.none{padding:22px 12px;text-align:center;color:var(--mute)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn.sm{padding:5px 12px;font-size:.8rem}
.auto{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--mute);cursor:pointer}
.auto input{accent-color:var(--acc);width:16px;height:16px;margin:0}
.msg{font-size:.8rem;color:var(--mute);line-height:1.35}
.msg:empty{display:none}
.msg.err{color:var(--err,#c5221f);font-weight:600}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main" "side";padding:12px}aside{max-height:none}.vol{width:110px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Reproductor</h1>
    <button class="btn" id="theme" aria-label="Cambiar tema">Tema</button>
    <button class="btn pri" id="add">Agregar archivos</button>
    <input type="file" id="file" accept="audio/*,video/*" multiple hidden>
  </header>

  <section class="main">
    <div class="stage" id="stage">
      <video id="v" playsinline></video>
      <audio id="a" preload="auto"></audio>
      <canvas id="viz"></canvas>
      <div class="empty" id="empty">
        <strong>Suelta aquí tus videos o canciones</strong>
        <span>Funciona con MP4, WebM, MP3, WAV, OGG y más. Los archivos se quedan en tu dispositivo y la lista se guarda para la próxima vez.</span>
        <div><button class="btn pri" id="add2">Elegir archivos</button></div>
      </div>
      <div class="title" id="ttl"></div>
    </div>
    <div class="ctrl">
      <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posición"><span id="dur">0:00</span></div>
      <div class="row">
        <button class="ib" id="shuf" aria-label="Aleatorio" title="Aleatorio (S)"></button>
        <button class="ib" id="prev" aria-label="Anterior" title="Anterior (P)"></button>
        <button class="ib big" id="pp" aria-label="Reproducir" title="Reproducir (Espacio)"></button>
        <button class="ib" id="next" aria-label="Siguiente" title="Siguiente (N)"></button>
        <button class="ib" id="rep" data-m="0" aria-label="Repetir" title="Repetir (R)"></button>
        <span class="sp"></span>
        <button class="spd" id="spd" aria-label="Velocidad">1x</button>
        <div class="vol"><button class="ib" id="mute" aria-label="Silenciar" title="Silenciar (M)"></button><input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen"></div>
        <button class="ib" id="fs" aria-label="Pantalla completa" title="Pantalla completa (F)"></button>
      </div>
    </div>
  </section>

  <aside>
    <div class="top">
      <div class="hd"><h2 id="count">Lista de reproducción</h2><button class="btn sm" id="clear" aria-label="Vaciar la lista">Vaciar</button></div>
      <input id="q" type="search" placeholder="Buscar en la lista" aria-label="Buscar en la lista">
      <label class="auto"><input type="checkbox" id="auto" checked> Guardar mis archivos en este dispositivo</label>
      <div class="msg" id="info"></div>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </div>
    <ul id="list"></ul>
  </aside>
</div>

<script>
const $=s=>document.querySelector(s);
const P={
 play:'M8 5v14l11-7z',pause:'M6 5h4v14H6zM14 5h4v14h-4z',
 prev:'M6 6h2v12H6zM9.5 12 18 18V6z',next:'M16 6h2v12h-2zM6 18l8.5-6L6 6z'
};
const S={
 shuf:'M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5',
 rep:'M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3',
 vol:'M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14',
 mute:'M11 5 6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6',
 fs:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5'
};
const fill=d=>`<svg viewBox="0 0 24 24" fill="currentColor"><path d="${d}"/></svg>`;
const line=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

const vid=$('#v'),aud=$('#a'),stage=$('#stage'),list=$('#list');
let items=[],cur=-1,shuffle=false,repeat=0,ctx,an,bins,raf;
const speeds=[1,1.25,1.5,2,0.75];let si=0;
let pendingSeek=null,orderCounter=Date.now(),autoSave=true,lastPosSave=0,lastPosState=0;

/* Dos reproductores: la música va en <audio> y los videos en <video>.
   Chrome para Android PAUSA los <video> al apagar la pantalla, pero deja seguir los <audio>.
   Por eso, si estás viendo un video y se apaga la pantalla, el sonido pasa solo al <audio>
   en el mismo segundo y, al volver a la app, regresa al video. «m» es el que está activo. */
let m=vid,wantPlay=false,handed=false,hiddenAt=0;
const setVolume=x=>{vid.volume=aud.volume=x};
const setMuted=b=>{vid.muted=aud.muted=b};
const setRate=r=>{vid.playbackRate=aud.playbackRate=r};
function setActive(el){
 if(el===m)return;
 const o=m;el.volume=o.volume;el.muted=o.muted;el.playbackRate=speeds[si];
 m=el;try{o.pause()}catch(e){} /* sus eventos se ignoran: ya no es el activo */
}
function pauseUser(){wantPlay=false;m.pause()}
function handoff(){ /* video -> audio (pantalla apagada) */
 if(handed||m!==vid||cur<0||!items[cur]||items[cur].kind!=='video')return;
 const t=vid.currentTime;
 setActive(aud);handed=true;
 pendingSeek=t;aud.src=items[cur].url;aud.playbackRate=speeds[si];
 aud.play().catch(()=>{});
}
function handback(){ /* audio -> video (pantalla encendida) */
 if(!handed||m!==aud||!items[cur])return;
 const t=aud.currentTime,was=!aud.paused;
 handed=false;setActive(vid);
 pendingSeek=t;vid.src=items[cur].url;vid.playbackRate=speeds[si];
 if(was&&wantPlay)vid.play().catch(()=>{});
}

/* En el celular el sonido NO pasa por Web Audio: así sigue sonando con la pantalla apagada
   o en otra app. El visualizador de audio solo usa Web Audio en computadora. */
const MOBILE=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'');

$('#shuf').innerHTML=line(S.shuf);$('#prev').innerHTML=fill(P.prev);$('#next').innerHTML=fill(P.next);
$('#rep').innerHTML=line(S.rep);$('#mute').innerHTML=line(S.vol);$('#fs').innerHTML=line(S.fs);$('#pp').innerHTML=fill(P.play);

const fmt=t=>{if(!isFinite(t))return'0:00';t=Math.floor(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
 return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const fmtSize=b=>b>=1073741824?(b/1073741824).toFixed(1)+' GB':b>=1048576?Math.round(b/1048576)+' MB':Math.max(1,Math.round(b/1024))+' KB';
const fillRange=r=>{r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%')};

/* ===== Ajustes y última posición (se recuerdan al volver a abrir) ===== */
const store={
 get(){try{return JSON.parse(localStorage.getItem('rep_pwa')||'{}')||{}}catch(e){return{}}},
 set(o){try{localStorage.setItem('rep_pwa',JSON.stringify(Object.assign(store.get(),o)))}catch(e){}}
};

/* ===== Lista guardada en el dispositivo (IndexedDB) =====
   Cada archivo agregado se copia a la base de datos de la app (el archivo
   y su duración por separado, para no reescribir el video al actualizar datos).
   Al abrir la app, la lista vuelve sola, en el mismo orden. */
const DB={
 p:null,ok:true,
 open(){
  if(DB.p)return DB.p;
  const p=new Promise((res,rej)=>{
   if(!window.indexedDB){rej(new Error('noidb'));return}
   let rq;try{rq=indexedDB.open('reproductor-pwa',1)}catch(e){rej(e);return}
   rq.onupgradeneeded=()=>{const d=rq.result;
    if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'id'});
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'id'})};
   rq.onsuccess=()=>{const d=rq.result;d.onversionchange=()=>{try{d.close()}catch(e){}DB.p=null};res(d)};
   rq.onerror=()=>rej(rq.error||new Error('dberr'));
   rq.onblocked=()=>rej(new Error('blocked'));
  });
  DB.p=p;p.catch(()=>{DB.ok=false;DB.p=null});
  return p;
 },
 run(stores,mode,fn){
  return DB.open().then(d=>new Promise((res,rej)=>{
   let tx,out;
   try{tx=d.transaction(stores,mode)}catch(e){rej(e);return}
   tx.oncomplete=()=>res(out&&('result' in out)?out.result:undefined);
   tx.onerror=()=>rej(tx.error);
   tx.onabort=()=>rej(tx.error||new Error('abort'));
   try{out=fn(tx)}catch(e){try{tx.abort()}catch(_){}rej(e)}
  }));
 }
};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const EXT={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',oga:'audio/ogg',opus:'audio/ogg',flac:'audio/flac',
 mp4:'video/mp4',m4v:'video/mp4',mov:'video/quicktime',webm:'video/webm',mkv:'video/x-matroska','3gp':'video/3gpp'};
const guessType=n=>EXT[(n.split('.').pop()||'').toLowerCase()]||'';

function setMsg(t,err){const m=$('#msg');m.textContent=t||'';m.className='msg'+(err?' err':'')}
function errText(e){
 if(e&&(e.name==='QuotaExceededError'||/quota/i.test(e.message||'')))return'No hay espacio suficiente en el celular para guardar. Libera espacio o quita archivos de la lista.';
 if(e&&(e.name==='NotReadableError'||e.name==='NotFoundError'))return'No se pudo leer el archivo original (¿lo movieron o lo borraron?). Vuelve a agregarlo.';
 return'No se pudo guardar. El archivo suena ahora, pero se perderá al cerrar la app.';
}
function updateInfo(){
 const el=$('#info');if(!el)return;
 if(!DB.ok){el.textContent='Este navegador no permite guardar la lista: los archivos se perderán al cerrar.';return}
 const sv=items.filter(x=>x.saved);
 const base=sv.length?`💾 ${sv.length} guardado${sv.length>1?'s':''} · ${fmtSize(sv.reduce((a,x)=>a+x.size,0))}`:'Nada guardado todavía.';
 el.textContent=base;
 try{if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{
  if(e&&e.quota&&e.quota>e.usage)el.textContent=base+' · Espacio libre aprox.: '+fmtSize(e.quota-e.usage)}).catch(()=>{})}catch(e){}
}
let persistAsked=false;
function askPersist(){if(persistAsked)return;persistAsked=true;try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}}

let saveChain=Promise.resolve();
function saveItems(arr){
 arr=arr.filter(x=>!x.saved&&!x.saving&&x.blob);
 if(!arr.length||!autoSave||!DB.ok)return;
 arr.forEach(it=>{it.saving=true;it.failed=false});
 render();
 let done=0,fail=0,lastErr=null;
 arr.forEach(it=>{
  saveChain=saveChain.then(()=>{
   if(!items.includes(it))return;
   setMsg(`Guardando ${done+fail+1} de ${arr.length}…`);
   return DB.run(['files','meta'],'readwrite',tx=>{
    tx.objectStore('files').put({id:it.id,name:it.name,name0:it.name0,kind:it.kind,type:it.type,size:it.size,order:it.order,blob:it.blob});
    tx.objectStore('meta').put({id:it.id,dur:it.dur||0});
   }).then(()=>{
    it.saved=true;it.saving=false;it.blob=null;done++;
    if(!items.includes(it))deleteSaved(it.id);
   }).catch(e=>{it.saving=false;it.failed=true;fail++;lastErr=e});
  }).then(()=>{render();updateInfo()});
 });
 saveChain=saveChain.then(()=>{
  if(fail)setMsg(errText(lastErr),true);
  else if(done){setMsg(`Listo: ${done} archivo${done>1?'s':''} guardado${done>1?'s':''} en tu dispositivo.`);askPersist()}
  else setMsg('');
 });
}
function deleteSaved(id){
 return DB.run(['files','meta'],'readwrite',tx=>{tx.objectStore('files').delete(id);tx.objectStore('meta').delete(id)}).catch(()=>{});
}
function saveDur(it){
 if(!it.saved||!it.dur)return;
 DB.run(['meta'],'readwrite',tx=>{tx.objectStore('meta').put({id:it.id,dur:it.dur})}).catch(()=>{});
}
async function restore(){
 try{
  const recs=await DB.run(['files'],'readonly',tx=>tx.objectStore('files').getAll())||[];
  const metas=await DB.run(['meta'],'readonly',tx=>tx.objectStore('meta').getAll())||[];
  const dm={};metas.forEach(m=>{dm[m.id]=m.dur});
  recs.sort((a,b)=>(a.order||0)-(b.order||0));
  const have=new Set(items.map(x=>x.id));let n=0;
  for(const r of recs){
   if(have.has(r.id)||!r.blob)continue;
   items.push({id:r.id,name:r.name,name0:r.name0||r.name,url:URL.createObjectURL(r.blob),kind:r.kind,type:r.type,size:r.size||r.blob.size||0,
    dur:dm[r.id]||0,order:r.order||0,saved:true,saving:false,failed:false,blob:null});
   if((r.order||0)>=orderCounter)orderCounter=r.order+1;
   n++;
  }
  render();updateInfo();
  if(n){
   setMsg(`Se recuperaron ${n} archivo${n>1?'s':''} de tu lista.`);
   const last=store.get().last;
   if(last&&cur<0){const i=items.findIndex(x=>x.id===last.id);if(i>=0)open(i,false,last.t||0)}
  }
 }catch(e){DB.ok=false;updateInfo()}
}

function addFiles(files){
 files=[...files];
 let added=0,dup=0,bad=0;const first=items.length,fresh=[];
 for(const f of files){
  const type=f.type||guessType(f.name);
  if(!/^(audio|video)\//.test(type)){bad++;continue}
  if(items.some(x=>x.name0===f.name&&x.size===f.size)){dup++;continue}
  const it={id:newId(),name:f.name.replace(/\.[^.]+$/,''),name0:f.name,url:URL.createObjectURL(f),kind:type.startsWith('video')?'video':'audio',type,size:f.size,
   dur:0,order:orderCounter++,saved:false,saving:false,failed:false,blob:f};
  const probe=document.createElement('video');probe.preload='metadata';probe.src=it.url;
  probe.onloadedmetadata=()=>{it.dur=probe.duration;saveDur(it);render()};
  items.push(it);fresh.push(it);added++;
 }
 render();
 if(dup||bad){setMsg([dup?`${dup} ya estaba${dup>1?'n':''} en la lista.`:'',bad?`${bad} no es de audio/video.`:''].filter(Boolean).join(' '))}
 if(added&&cur<0)play(first);
 saveItems(fresh);
}

let rpend=false;
function render(){if(rpend)return;rpend=true;Promise.resolve().then(()=>{rpend=false;draw()})}
function draw(){
 const q=$('#q').value.trim().toLowerCase();
 $('#count').textContent=items.length?`Lista de reproducción (${items.length})`:'Lista de reproducción';
 list.innerHTML='';
 const shown=items.map((it,i)=>[it,i]).filter(([it])=>it.name.toLowerCase().includes(q));
 if(!shown.length){list.innerHTML=`<li class="none" style="display:block">${items.length?'Ningún resultado para esa búsqueda.':'Aún no hay archivos. Agrégalos para empezar.'}</li>`;return}
 for(const [it,i] of shown){
  const li=document.createElement('li');if(i===cur)li.className='act';
  const st=it.saving?' · Guardando…':it.failed?' · No se pudo guardar':'';
  li.innerHTML=`<button class="pl"><span class="n"></span><span class="m">${it.kind==='video'?'Video':'Audio'}${it.dur?' · '+fmt(it.dur):''}${st}</span></button><button class="rm" aria-label="Quitar de la lista">×</button>`;
  li.querySelector('.n').textContent=it.name;
  li.querySelector('.pl').onclick=()=>play(i);
  li.querySelector('.rm').onclick=()=>remove(i);
  list.appendChild(li);
 }
}

function resetStage(){
 wantPlay=false;handed=false;[vid,aud].forEach(e=>{e.pause();e.removeAttribute('src');e.load()});m=vid;cur=-1;pendingSeek=null;
 stage.classList.remove('has','audio');$('#ttl').textContent='';$('#empty').style.display='';
 document.title='Reproductor de video y música';
 $('#cur').textContent='0:00';$('#dur').textContent='0:00';$('#seek').value=0;fillRange($('#seek'));
 if('mediaSession' in navigator){try{navigator.mediaSession.metadata=null;navigator.mediaSession.playbackState='none'}catch(e){}}
}
function remove(i){
 const it=items[i];if(!it)return;
 URL.revokeObjectURL(it.url);if(it.saved)deleteSaved(it.id);
 items.splice(i,1);
 const l=store.get().last;if(l&&l.id===it.id)store.set({last:null});
 if(i===cur)resetStage();
 else if(i<cur)cur--;
 render();updateInfo();
}
function clearAll(){
 if(!items.length)return;
 if(!confirm('¿Vaciar la lista? También se borrarán los archivos guardados en este dispositivo.'))return;
 items.forEach(it=>URL.revokeObjectURL(it.url));
 items=[];resetStage();store.set({last:null});
 DB.run(['files','meta'],'readwrite',tx=>{tx.objectStore('files').clear();tx.objectStore('meta').clear()}).catch(()=>{});
 setMsg('Lista vaciada.');render();updateInfo();
}

function setupAudio(){
 if(ctx||MOBILE)return;
 try{
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const s1=ctx.createMediaElementSource(vid),s2=ctx.createMediaElementSource(aud);an=ctx.createAnalyser();an.fftSize=128;
  s1.connect(an);s2.connect(an);an.connect(ctx.destination);bins=new Uint8Array(an.frequencyBinCount);
 }catch(e){ctx=null;an=null}
}

/* ===== Controles del sistema (notificación, pantalla de bloqueo, teclas multimedia) ===== */
function setMeta(it){
 if(!('mediaSession' in navigator)||typeof MediaMetadata==='undefined')return;
 try{navigator.mediaSession.metadata=new MediaMetadata({title:it.name,artist:it.kind==='video'?'Video':'Audio',album:'Reproductor',
  artwork:[{src:'icons/icon-512.png',sizes:'512x512',type:'image/png'},{src:'icons/icon-192.png',sizes:'192x192',type:'image/png'}]})}catch(e){}
}
function setPos(){
 if(!('mediaSession' in navigator)||!navigator.mediaSession.setPositionState)return;
 try{if(isFinite(m.duration)&&m.duration>0)navigator.mediaSession.setPositionState({duration:m.duration,playbackRate:m.playbackRate||1,position:Math.min(Math.max(0,m.currentTime||0),m.duration)})}catch(e){}
}
if('mediaSession' in navigator){
 const ms=navigator.mediaSession,h=(a,f)=>{try{ms.setActionHandler(a,f)}catch(e){}};
 h('play',()=>{if(cur<0){if(items.length)play(0)}else m.play().catch(()=>{})});
 h('pause',pauseUser);h('stop',pauseUser);
 h('previoustrack',()=>prev());h('nexttrack',()=>next(false));
 h('seekbackward',d=>{m.currentTime=Math.max(0,m.currentTime-((d&&d.seekOffset)||10));setPos()});
 h('seekforward',d=>{m.currentTime=Math.min(m.duration||0,m.currentTime+((d&&d.seekOffset)||10));setPos()});
 h('seekto',d=>{if(d&&isFinite(d.seekTime)){m.currentTime=d.seekTime;setPos()}});
}

function savePos(){if(cur>=0&&items[cur])store.set({last:{id:items[cur].id,t:m.currentTime||0}})}

/* Abre un archivo. auto=false: lo deja listo en pausa (al recuperar la lista); seek: segundo donde continuar. */
function open(i,auto,seek){
 if(i<0||i>=items.length)return;
 cur=i;const it=items[i];
 pendingSeek=seek>0?seek:null;
 const useAud=it.kind==='audio'||document.hidden; /* música -> <audio>; video con pantalla apagada -> <audio> */
 handed=useAud&&it.kind==='video';
 setActive(useAud?aud:vid);
 m.src=it.url;m.playbackRate=speeds[si];
 stage.classList.add('has');stage.classList.toggle('audio',it.kind==='audio');
 $('#empty').style.display='none';$('#ttl').textContent=it.name;document.title=it.name+' · Reproductor';
 setMeta(it);store.set({last:{id:it.id,t:seek||0}});
 if(auto){setupAudio();if(ctx&&ctx.state==='suspended')ctx.resume();m.play().catch(()=>{})}
 render();
}
const play=i=>open(i,true,0);

function next(auto){
 if(!items.length)return;
 let n;
 if(shuffle&&items.length>1){do{n=Math.floor(Math.random()*items.length)}while(n===cur)}
 else{n=cur+1;if(n>=items.length){if(repeat===1||!auto)n=0;else return}}
 play(n);
}
function prev(){
 if(m.currentTime>3){m.currentTime=0;return}
 play(cur>0?cur-1:items.length-1);
}
function toggle(){
 if(cur<0){if(items.length)play(0);else $('#file').click();return}
 if(m.paused){setupAudio();if(ctx&&ctx.state==='suspended')ctx.resume();m.play().catch(()=>{})}else pauseUser();
}

function bind(el){
 const act=f=>(...x)=>{if(el===m)f(...x)};  /* solo escucha al reproductor activo */
 el.addEventListener('play',act(()=>{wantPlay=true;$('#pp').innerHTML=fill(P.pause);$('#pp').setAttribute('aria-label','Pausar');
  if('mediaSession' in navigator){try{navigator.mediaSession.playbackState='playing'}catch(e){}}setPos();loop()}));
 el.addEventListener('pause',act(()=>{$('#pp').innerHTML=fill(P.play);$('#pp').setAttribute('aria-label','Reproducir');
  if('mediaSession' in navigator){try{navigator.mediaSession.playbackState='paused'}catch(e){}}savePos();setPos();
  /* Chrome pausó el video porque se apagó la pantalla (no fue el usuario): seguir con el sonido en <audio> */
  if(el===vid&&document.hidden&&wantPlay&&Date.now()-hiddenAt<1500)handoff()}));
 el.addEventListener('loadedmetadata',act(()=>{
  $('#dur').textContent=fmt(m.duration);
  if(pendingSeek!=null){try{m.currentTime=Math.min(pendingSeek,m.duration||pendingSeek)}catch(e){}pendingSeek=null}
  if(items[cur]&&!items[cur].dur){items[cur].dur=m.duration;saveDur(items[cur]);render()}
  setPos();
 }));
 el.addEventListener('seeked',act(setPos));
 el.addEventListener('ratechange',act(setPos));
 el.addEventListener('timeupdate',act(()=>{
  $('#cur').textContent=fmt(m.currentTime);
  if(m.duration){$('#seek').value=m.currentTime/m.duration*1000;fillRange($('#seek'))}
  const now=Date.now();
  if(now-lastPosSave>3000){lastPosSave=now;savePos()}
  if(now-lastPosState>1000){lastPosState=now;setPos()}
 }));
 el.addEventListener('ended',act(()=>{wantPlay=false;if(repeat===2){m.currentTime=0;m.play()}else next(true)}));
 el.addEventListener('error',act(()=>{if(cur>=0)$('#ttl').textContent='No se pudo reproducir este archivo. Prueba con otro formato.'}));
}
bind(vid);bind(aud);
addEventListener('pagehide',savePos);
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){hiddenAt=Date.now();savePos();if(wantPlay&&m===vid&&!vid.paused)handoff()}
 else handback();
});

$('#seek').addEventListener('input',e=>{if(m.duration)m.currentTime=e.target.value/1000*m.duration;fillRange(e.target)});
$('#vol').addEventListener('input',e=>{setVolume(+e.target.value);setMuted(false);fillRange(e.target);muteIcon();store.set({vol:m.volume})});
function muteIcon(){$('#mute').innerHTML=line(m.muted||m.volume===0?S.mute:S.vol)}
$('#mute').onclick=()=>{setMuted(!m.muted);muteIcon()};
$('#pp').onclick=toggle;$('#next').onclick=()=>next(false);$('#prev').onclick=prev;
function setShuffle(on){shuffle=on;$('#shuf').classList.toggle('on',shuffle)}
function setRepeat(n){repeat=n;const b=$('#rep');b.dataset.m=repeat;b.classList.toggle('on',repeat>0);
 b.title=['Repetir: no','Repetir: toda la lista','Repetir: esta pista'][repeat]}
function setSpeed(n){si=n;setRate(speeds[si]);$('#spd').textContent=speeds[si]+'x'}
$('#shuf').onclick=()=>{setShuffle(!shuffle);store.set({shuf:shuffle})};
$('#rep').onclick=()=>{setRepeat((repeat+1)%3);store.set({rep:repeat})};
$('#spd').onclick=()=>{setSpeed((si+1)%speeds.length);store.set({si})};
$('#fs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen()}catch(e){}};
stage.addEventListener('dblclick',()=>$('#fs').click());
stage.addEventListener('click',e=>{if(e.target.closest('button'))return;if(cur>=0)toggle()});
$('#q').addEventListener('input',render);
$('#clear').onclick=clearAll;
$('#auto').addEventListener('change',e=>{
 autoSave=e.target.checked;store.set({auto:autoSave});
 if(autoSave){saveItems(items)}else setMsg('Los archivos nuevos no se guardarán: se perderán al cerrar la app.');
});

const pick=()=>$('#file').click();
$('#add').onclick=pick;$('#add2').onclick=pick;
$('#file').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});

function setTheme(t){document.documentElement.dataset.theme=t}
$('#theme').onclick=()=>{
 const r=document.documentElement;
 const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
 setTheme(dark?'light':'dark');store.set({theme:dark?'light':'dark'});
};

const app=$('#app');let dc=0;
addEventListener('dragenter',e=>{e.preventDefault();dc++;app.classList.add('drag')});
addEventListener('dragleave',()=>{dc=Math.max(0,dc-1);if(!dc)app.classList.remove('drag')});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;app.classList.remove('drag');if(e.dataTransfer)addFiles(e.dataTransfer.files)});

addEventListener('keydown',e=>{
 if(e.target.matches('input[type=search],input[type=text],input[type=checkbox]')||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.target.matches('button')&&e.code==='Space')return;
 const k=e.key.toLowerCase();let h=true;
 if(e.code==='Space')toggle();
 else if(e.key==='ArrowRight')m.currentTime=Math.min(m.duration||0,m.currentTime+5);
 else if(e.key==='ArrowLeft')m.currentTime=Math.max(0,m.currentTime-5);
 else if(e.key==='ArrowUp'){setVolume(Math.min(1,m.volume+.05));$('#vol').value=m.volume;fillRange($('#vol'))}
 else if(e.key==='ArrowDown'){setVolume(Math.max(0,m.volume-.05));$('#vol').value=m.volume;fillRange($('#vol'))}
 else if(k==='m')$('#mute').click();
 else if(k==='f')$('#fs').click();
 else if(k==='n')next(false);
 else if(k==='p')prev();
 else if(k==='s')$('#shuf').click();
 else if(k==='r')$('#rep').click();
 else h=false;
 if(h)e.preventDefault();
});

/* Visualizador para audio (Web Audio en computadora; en el celular es solo decorativo) */
const cv=$('#viz'),g=cv.getContext('2d');
function fakeBins(t){
 const n=32;if(!bins||bins.length!==n)bins=new Uint8Array(n);
 for(let i=0;i<n;i++){const a=Math.sin(t/260+i*.7)*.5+.5,b=Math.sin(t/170+i*1.3)*.5+.5;bins[i]=Math.round(40+(a*.6+b*.4)*180)}
}
function loop(){
 cancelAnimationFrame(raf);
 const drawViz=()=>{
  if(m.paused&&!stage.classList.contains('audio'))return;
  if(stage.classList.contains('audio')){
   const w=cv.width=cv.clientWidth*devicePixelRatio,h=cv.height=cv.clientHeight*devicePixelRatio;
   g.clearRect(0,0,w,h);
   if(an){an.getByteFrequencyData(bins)}else fakeBins(performance.now());
   const n=bins?bins.length:0,gap=w/n*.25,bw=w/n-gap;
   g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#8f86ff';
   for(let i=0;i<n;i++){
    const bh=Math.max(4*devicePixelRatio,bins[i]/255*h*.7);
    g.beginPath();g.roundRect?g.roundRect(i*(bw+gap)+gap/2,h*.82-bh,bw,bh,bw/2):g.rect(i*(bw+gap)+gap/2,h*.82-bh,bw,bh);g.fill();
   }
  }
  if(!m.paused)raf=requestAnimationFrame(drawViz);
 };
 drawViz();
}

/* ===== Arranque: ajustes guardados y lista guardada ===== */
(function(){
 const s=store.get();
 if(typeof s.vol==='number'&&s.vol>=0&&s.vol<=1){setVolume(s.vol);$('#vol').value=s.vol}else setVolume(0.8);
 fillRange($('#vol'));muteIcon();
 if(s.shuf)setShuffle(true);
 if(s.rep>=0&&s.rep<=2)setRepeat(s.rep|0);
 if(s.si>=0&&s.si<speeds.length)setSpeed(s.si|0);
 if(s.theme==='light'||s.theme==='dark')setTheme(s.theme);
 if(s.auto===false){autoSave=false;$('#auto').checked=false}
})();
render();updateInfo();
restore();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
